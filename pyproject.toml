[project]
name = "lookalike"
version = "0.2.0"
description = "Lookalike Audience & Lead Generation platform (FastAPI + LightGBM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "lightgbm>=4.5.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
scripts = [
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.scripts]
lookalike-api = "lookalike.main:run"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that sample the 100k-row production CSV",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
